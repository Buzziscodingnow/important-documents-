<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMPORTANT DOCUMENTS SEND ASAP</title>
  <style>
    :root { --ink:#65556d; --pink:#ff8fac; --paper:#fffdfd; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 15px; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color:var(--ink); background: radial-gradient(circle at 15% 20%,#ffe7ef 0 13%,transparent 35%),radial-gradient(circle at 85% 78%,#e1dbff 0 10%,transparent 36%),linear-gradient(135deg,#fff7fa,#f7f3ff); }
    .card { width:min(100%,520px); background:rgba(255,255,255,.86); border:2px solid white; border-radius:30px; padding:38px 28px 34px; box-shadow:0 16px 46px #ae8ab630; text-align:center; position:relative; }
    .bow { font-size:38px; margin-bottom:8px; }
    h1 { font-size:clamp(23px,5vw,31px); line-height:1.25; margin:6px 0 10px; letter-spacing:.5px; color:#d46f91; }
    .subtitle { color:#9a8ca1; margin:0 0 27px; font-size:14px; }
    ul { padding:0; margin:0; list-style:none; display:grid; gap:13px; text-align:left; }
    li { background:linear-gradient(100deg,#fff1f6,#faf5ff); border:1px solid #f8e6f0; padding:16px 18px; border-radius:17px; display:flex; align-items:center; gap:14px; font-size:16px; font-weight:600; box-shadow:0 4px 9px #e4cade1c; }
    .number { flex:0 0 32px; height:32px; display:grid; place-items:center; background:white; border-radius:50%; color:#d8759d; box-shadow:0 2px 7px #d9a7c744; font-size:14px; }
    .footer { margin:26px 0 0; font-size:13px; color:#ae91a2; }
    @media(max-width:400px){.card{padding:30px 18px}.subtitle{font-size:13px}li{font-size:15px;padding:14px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="bow" aria-hidden="true">🎀</div>
    <h1>IMPORTANT DOCUMENTS<br>SEND ASAP</h1>
    <p class="subtitle"> MISS ME MISS ME :3 :3 ♡</p>
    <ul id="documents"></ul>
    <p class="footer">See you soooonnn! ♡ ✨</p>
  </main>
  <script>
    // CUSTOMIZE THESE FIVE TEXT ITEMS (no links):
    const documents = [
      "100 hugs",
      "200 kisses ",
      "One makeout session ",
      "Some coke & tequilla ",
      "Whole lot of you "
    ];
    const list = document.getElementById('documents');
    documents.forEach((name, index) => {
      const item = document.createElement('li');
      const number = document.createElement('span');
      number.className = 'number';
      number.textContent = String(index + 1).padStart(2, '0');
      const label = document.createElement('span');
      label.textContent = name;
      item.append(number, label);
      list.appendChild(item);
    });
  </script>
</body>
</html>
